{% extends "layout.html" %}

{% block body %}

    <form action="/sport" method="post">
        <input type="text" autofocus autocomplete="off" name="name" placeholder="Name" required>       
            {% for sport in sports %}
            <input type="checkbox" name="sport" value="{{ sport }}"> {{ sport }}
            {% endfor %}
        <button type="submit">Submit</button>
    </form>

{% endblock %}
